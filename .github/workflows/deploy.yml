name: Build and Push Docker Images

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'frontend/Dockerfile'
      - 'requirements*.txt'
      - 'app/**'
      - 'frontend/**'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: backend
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/opsrag-backend:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/opsrag-backend:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/opsrag-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/opsrag-backend:buildcache,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/opsrag-frontend:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/opsrag-frontend:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/opsrag-frontend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/opsrag-frontend:buildcache,mode=max

      - name: Build and push bootstrap image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: bootstrap
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/opsrag-bootstrap:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/opsrag-bootstrap:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/opsrag-bootstrap:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/opsrag-bootstrap:buildcache,mode=max

  test:
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: opsrag
          POSTGRES_PASSWORD: testpass123456
          POSTGRES_DB: opsrag_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest -q -p no:cacheprovider

      - name: Run integration tests
        env:
          OPSRAG_RUN_INTEGRATION_TESTS: "1"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: opsrag
          POSTGRES_PASSWORD: testpass123456
          POSTGRES_DB: opsrag_test
        run: pytest -m integration -q

  notify:
    runs-on: ubuntu-latest
    needs: [build-and-push, test]
    if: always()
    steps:
      - name: Notify success
        if: needs.build-and-push.result == 'success' && needs.test.result == 'success'
        run: echo "✓ Build, push, and tests passed. Images pushed to ${{ secrets.DOCKER_HUB_USERNAME }}"

      - name: Notify failure
        if: failure()
        run: echo "✗ Pipeline failed. Check logs."
